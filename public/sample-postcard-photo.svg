<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CFA8" />
      <stop offset="55%" stop-color="#F3DFC1" />
      <stop offset="100%" stop-color="#DFB88C" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C6D53" />
      <stop offset="45%" stop-color="#6E523C" />
      <stop offset="100%" stop-color="#4A3322" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.68" cy="0.42" r="0.35">
      <stop offset="0%" stop-color="#FFF7E8" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#F5D096" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E8CFA8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Warm afternoon harbor sky -->
  <rect width="800" height="330" fill="url(#sky)" />
  <rect width="800" height="330" fill="url(#sunGlow)" />

  <!-- Afternoon sun -->
  <circle cx="544" cy="198" r="46" fill="#FFF6E5" opacity="0.92" />

  <!-- Distant harbor hills & old town roofs -->
  <path d="M0,295 Q130,245 270,278 T540,268 T800,285 L800,330 L0,330 Z" fill="#9E7E62" opacity="0.65" />
  <path d="M0,312 Q180,278 360,304 T800,296 L800,330 L0,330 Z" fill="#7A5B43" opacity="0.85" />

  <!-- Harbor water & golden reflection -->
  <rect y="325" width="800" height="215" fill="url(#sea)" />
  <g fill="#F8E2BC" opacity="0.55">
    <rect x="498" y="338" width="92" height="4" rx="2" />
    <rect x="510" y="352" width="68" height="3.5" rx="1.75" />
    <rect x="486" y="368" width="114" height="4" rx="2" />
    <rect x="504" y="386" width="80" height="3" rx="1.5" />
    <rect x="518" y="404" width="54" height="3" rx="1.5" />
  </g>

  <!-- Heritage wooden window sill & coffee cup in foreground -->
  <rect y="438" width="800" height="102" fill="#3A2314" />
  <rect y="438" width="800" height="8" fill="#5C3B24" />

  <!-- Window frame pillars -->
  <rect x="0" y="0" width="38" height="446" fill="#3A2314" />
  <rect x="762" y="0" width="38" height="446" fill="#3A2314" />
  <rect x="0" y="0" width="800" height="28" fill="#3A2314" />

  <!-- Warm ceramic coffee cup on wooden sill -->
  <ellipse cx="230" cy="466" rx="64" ry="11" fill="#26150B" opacity="0.45" />
  <ellipse cx="230" cy="458" rx="56" ry="9" fill="#E8DCCB" stroke="#523624" stroke-width="2" />
  <path d="M188,402 L272,402 C270,438 258,456 230,456 C202,456 190,438 188,402 Z" fill="#FBF8F3" stroke="#523624" stroke-width="2.5" />
  <path d="M270,412 C292,412 292,440 266,442" fill="none" stroke="#FBF8F3" stroke-width="7" stroke-linecap="round" />
  <path d="M270,412 C292,412 292,440 266,442" fill="none" stroke="#523624" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="230" cy="402" rx="42" ry="7" fill="#684E3A" stroke="#523624" stroke-width="2" />

  <!-- Gentle coffee steam -->
  <path d="M218,384 Q210,362 224,344 T218,308" fill="none" stroke="#FFFDF9" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M240,388 Q248,366 236,348 T244,314" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-linecap="round" opacity="0.55" />

  <!-- Subtle stamp caption in corner -->
  <text x="736" y="498" text-anchor="end" fill="#D8C8B4" font-family="serif" font-size="16" letter-spacing="2">港町午後・留聲記憶</text>
</svg>
